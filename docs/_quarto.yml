project:
  type: website
  output-dir: _site

# Pull in the sidebar that quartodoc generates for the reference section.
# Run `python build_reference.py` before rendering or previewing (see README.md);
# it wraps `quartodoc build` and keeps dunder methods in the reference.
# It is deliberately not a `pre-render` step: the build rewrites this sidebar
# file on every run, the preview server treats that as a config change and
# reloads every open browser tab, which cancels in-flight page navigation.
metadata-files:
  - reference/_sidebar.yml

website:
  title: "Open Music Kit"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: examples.qmd
        text: Examples
      - href: overview.md
        text: Overview
      - href: goals.md
        text: Goals
      - href: reference/index.qmd
        text: API Reference

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true

execute:
  # Executable pages fail the build if a code cell raises,
  # so the examples double as a smoke test of the public API.
  error: false

quartodoc:
  package: openmusickit
  dir: reference
  title: API Reference
  sidebar: reference/_sidebar.yml
  # Import the package and inspect it, instead of parsing the source statically:
  # static analysis cannot see dataclass-generated __init__ signatures.
  renderer:
    style: markdown
    show_signature_annotations: true
  # `options` applies to every documented object, recursively; `member_options`
  # overrides it for the members of each listed module (its classes and
  # functions). Modules get a page with summary tables (children: separate);
  # each class gets its own page with its methods embedded on it.
  # Static analysis already lists inherited dataclass fields in constructor
  # signatures; include_inherited adds the inherited methods and properties.
  # (`dynamic: true` gives the same signatures and crashes on two aliases here.)
  options:
    include_inherited: true
    include_empty: true  # list undocumented members too, so the gaps are visible
    member_order: source
    signature_name: short
    children: separate
    member_options:
      children: embedded
  # Module order: abstract values first, then the WSMN implementation,
  # then the score objects and the graph that holds them.
  sections:
    - title: Values
      desc: Abstract musical values, independent of any particular musical system.
      contents:
        - values.tone.tone
        - values.tone.interval
        - values.tone.silent_tone
        - values.tone.unpitched_tone
        - values.tone.tone_collection
        - values.tone.modal_context
        - values.time.duration
        - values.time.clock_time
        - values.text.word
        - values.scoring.mark
        - values.scoring.division_shape
        - values.scoring.tempo_term
        - values.scoring.clef
    - title: Western Standard Music Notation
      desc: The WSMN implementation of the abstract values.
      contents:
        - systems.wsmn.tonal.tonal_vector
        - systems.wsmn.tonal.tonal_arithmetic
        - systems.wsmn.tonal.interval_quality
        - systems.wsmn.tonal.chords
        - systems.wsmn.tonal.key
        - name: systems.wsmn.tonal.symbols
          children: embedded  # hundreds of constants; one page, not one page each
        - systems.wsmn.temporal.metrical_duration
        - systems.wsmn.temporal.time_signature
        - name: systems.wsmn.temporal.symbols
          children: embedded  # hundreds of constants; one page, not one page each
        - systems.wsmn.scoring.bar_line_shape
        - systems.wsmn.scoring.staff_clef
        - name: systems.wsmn.scoring.symbols
          children: embedded  # hundreds of constants; one page, not one page each
        - systems.wsmn.percussion.percussion_tone
        - name: systems.wsmn.percussion.symbols
          children: embedded  # dozens of constants; one page, not one page each
    - title: Objects
      desc: Score objects, the things that become nodes in the graph.
      contents:
        - objects.omk_object
        - objects.note_event
        - objects.chord_event
        - objects.context_event
        - objects.division_event
        - objects.lyrics
        - objects.marking
        - objects.part
    - title: Graph
      desc: The score graph and its edges.
      contents:
        - graph.graph
        - graph.edge
        - graph.graph_adapter
        - graph.rx_adapter
    - title: Errors and Utilities
      contents:
        - errors
        - utils.number_names
