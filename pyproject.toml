[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmusickit"
version = "0.0.1"
description = "Open Music Kit: Music encoding/decoding tools for computational analysis and machine learning."
authors = [
  { name = "Adam Michael Wood", email = "adam.michael.wood@gmail.com" }
]
license = { text = "AGPL-3.0" }
readme = "README.md"
requires-python = ">=3.12"

# Add your base dependencies here
dependencies = [
    "rustworkx>=0.18.1",
    "bidict>=0.24.1",
]

# [project.urls]
# Homepage = "https://github.com/openmusickit"
# Documentation = "https://openmusickit.org"
# Repository = "https://github.com/openmusickit/openmusickit"
# Issues = "https://github.com/openmusickit/openmusickit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FA", "W", "TID252"]
ignore = [
    "E501",  # line length is handled by the formatter; long docstring lines are fine
]

[tool.ruff.lint.isort]
known-first-party = ["openmusickit"]
force-single-line = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
