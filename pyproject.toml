[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmusickit"
version = "0.1.0"
description = "A symbolic music representation library: scores as graphs of musical objects, at any level of completeness, in any musical system."
authors = [
  { name = "Adam Michael Wood", email = "adam.michael.wood@gmail.com" }
]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Add your base dependencies here
dependencies = [
    "rustworkx>=0.18.1",
    "bidict>=0.24.1",
]

[project.urls]
Homepage = "https://openmusickit.org"
Documentation = "https://openmusickit.org"
Repository = "https://github.com/openmusickit/openmusickit"
Issues = "https://github.com/openmusickit/openmusickit/issues"
Changelog = "https://github.com/openmusickit/openmusickit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmusickit = ["py.typed"]

[dependency-groups]
test = [
    "hypothesis>=6.168.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
# Separate from `test` because quartodoc needs pydantic-core, which has no Python 3.15 wheel yet.
docs = [
    "griffe<2",  # quartodoc 0.11 still calls a parser keyword that griffe 2 removed
    "quarto-cli>=1.10.18",
    "quartodoc>=0.11.1",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "-m", "not slow"]  # `uv run pytest -m slow` runs the heavy set
markers = ["slow: exhaustive or thorough runs, skipped by default; run with `uv run pytest -m slow`"]
pythonpath = ["."]  # so tests can import shared helpers as `tests.domains`, `tests.graph.helpers`
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FA", "W", "TID252"]
ignore = [
    "E501",  # line length is handled by the formatter; long docstring lines are fine
]

[tool.ruff.lint.isort]
known-first-party = ["openmusickit", "tests"]
force-single-line = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["TID252"]  # package __init__ files re-export their own submodules with `from . import`
# interval_quality.py is deferred to a dedicated cleanup session (see _plans/revisit.md)
"src/openmusickit/systems/wsmn/tonal/interval_quality.py" = ["B007"]
