[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmusickit"
version = "0.0.1"
description = "Open Music Kit: Music encoding/decoding tools for computational analysis and machine learning."
authors = [
  { name = "Adam Michael Wood", email = "adam.michael.wood@gmail.com" }
]
license = { text = "AGPL-3.0" }
readme = "README.md"
requires-python = ">=3.12"

# Add your base dependencies here
dependencies = [
    "rustworkx>=0.18.1",
    "bidict>=0.24.1",
]

# [project.urls]
# Homepage = "https://github.com/openmusickit"
# Documentation = "https://openmusickit.org"
# Repository = "https://github.com/openmusickit/openmusickit"
# Issues = "https://github.com/openmusickit/openmusickit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "griffe<2",  # quartodoc 0.11 still calls a parser keyword that griffe 2 removed
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "quarto-cli>=1.10.18",
    "quartodoc>=0.11.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "-m", "not slow"]  # `uv run pytest -m slow` runs the heavy set
markers = ["slow: exhaustive or thorough runs, skipped by default; run with `uv run pytest -m slow`"]
pythonpath = ["."]  # so tests can import shared helpers as `tests.domains`, `tests.graph.helpers`
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FA", "W", "TID252"]
ignore = [
    "E501",  # line length is handled by the formatter; long docstring lines are fine
]

[tool.ruff.lint.isort]
known-first-party = ["openmusickit", "tests"]
force-single-line = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["TID252"]  # package __init__ files re-export their own submodules with `from . import`
# interval_quality.py is deferred to a dedicated cleanup session (see _plans/revisit.md)
"src/openmusickit/systems/wsmn/tonal/interval_quality.py" = ["B007"]
